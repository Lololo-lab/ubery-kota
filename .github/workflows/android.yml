name: Android build

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '*.md', 'store/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install and sync web assets
        run: |
          npm ci
          npx cap sync android

      - name: Build AAB (Google Play, unsigned - signed later) and debug APK (test on phone)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon bundleRelease assembleDebug

      - name: Collect files
        run: |
          mkdir -p out
          cp android/app/build/outputs/bundle/release/*.aab out/ubery-kota.aab
          cp android/app/build/outputs/apk/debug/*.apk out/ubery-kota-test.apk
          ls -la out

      - uses: actions/upload-artifact@v5
        with:
          name: ubery-kota-build
          path: out/
          retention-days: 30

      - name: Publish files to the 'builds' branch
        run: |
          cd out
          echo "Build of ${GITHUB_SHA}" > BUILD.txt
          git init -q -b builds
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add .
          git commit -q -m "Build ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" builds

  smoke-test:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { api: 28, profile: "Nexus 5" }
          - { api: 29, profile: "Nexus 5" }
          - { api: 33, profile: "pixel_6" }
          - { api: 35, profile: "pixel_7_pro" }
          - { api: 36, profile: "pixel_tablet" }
    steps:
      - uses: actions/checkout@v5

      - uses: actions/checkout@v5
        with:
          ref: builds
          path: b

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Play the app on Android API ${{ matrix.api }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          profile: ${{ matrix.profile }}
          disable-animations: true
          script: |
            adb install -r b/ubery-kota-test.apk
            adb logcat -c
            adb shell monkey -p kg.lololo.uberikota -c android.intent.category.LAUNCHER 1
            sleep 18
            adb exec-out screencap -p > s1-menu.png
            adb shell dumpsys webviewupdate | grep -i "current webview package" > webview.txt || true
            python3 tools/tap_text.py "Play" > taps.txt
            sleep 3
            python3 tools/tap_text.py "Got it" >> taps.txt
            sleep 3
            adb exec-out screencap -p > s2-intro.png
            python3 tools/tap_text.py "go!" >> taps.txt
            sleep 4
            adb exec-out screencap -p > s3-game.png
            adb shell input keyevent 4
            sleep 2
            python3 tools/tap_text.py "Menu" >> taps.txt
            sleep 3
            python3 tools/tap_text.py "Claim" --exact >> taps.txt
            sleep 2
            python3 tools/tap_text.py "Ranking" >> taps.txt
            sleep 3
            adb exec-out screencap -p > s4-nick.png
            adb shell pidof kg.lololo.uberikota > alive.txt || echo "APP NOT RUNNING" > alive.txt
            adb logcat -d > logcat.txt

      - name: Save results to 'smoke-${{ matrix.api }}' branch
        if: always()
        run: |
          mkdir -p res && cp s*.png *.txt res/ 2>/dev/null || true
          grep -E "Capacitor/Console.*(Error|Uncaught)|JavaScript Error|FATAL EXCEPTION|AndroidRuntime: Process" logcat.txt > res/errors.txt || true
          rm -f res/logcat.txt; grep -E "Capacitor|AndroidRuntime|chromium.*Console|uberikota" logcat.txt | tail -400 > res/log-short.txt || true
          echo "Build of ${GITHUB_SHA}, API ${{ matrix.api }}, ${{ matrix.profile }}" > res/BUILD.txt
          cd res
          git init -q -b smoke-${{ matrix.api }}
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -q -m "smoke ${{ matrix.api }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" smoke-${{ matrix.api }}
