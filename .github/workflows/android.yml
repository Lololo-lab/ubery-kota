name: Android build

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '*.md', 'store/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install and sync web assets
        run: |
          npm ci
          npx cap sync android

      - name: Build AAB (Google Play, unsigned - signed later) and debug APK (test on phone)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon bundleRelease assembleDebug

      - name: Collect files
        run: |
          mkdir -p out
          cp android/app/build/outputs/bundle/release/*.aab out/ubery-kota.aab
          cp android/app/build/outputs/apk/debug/*.apk out/ubery-kota-test.apk
          ls -la out

      - uses: actions/upload-artifact@v5
        with:
          name: ubery-kota-build
          path: out/
          retention-days: 30

      - name: Publish files to the 'builds' branch
        run: |
          cd out
          echo "Build of ${GITHUB_SHA}" > BUILD.txt
          git init -q -b builds
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add .
          git commit -q -m "Build ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" builds
